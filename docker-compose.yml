version: '3.8'
services:
  mariadb:
    image: mariadb:10.6
    environment:
      MYSQL_ROOT_PASSWORD: root_password_seguro
      MYSQL_DATABASE: moodle
      MYSQL_USER: moodleuser
      MYSQL_PASSWORD: moodlepass
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: always

  moodle:
    image: moodlehq/moodle-php-apache:8.1
    ports:
      - "80:80"
    environment:
      MOODLE_DB_HOST: mariadb
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: moodleuser
      MOODLE_DB_PASSWORD: moodlepass
      MOODLE_WWWROOT: http://TU_IP_PUBLICA
    volumes:
      - moodle_code:/var/www/html
    command: >
      bash -c "if [ ! -f /var/www/html/index.php ]; then
                 git clone -b MOODLE_405_STABLE --depth 1 https://github.com/moodle/moodle.git /var/www/html;
               fi &&
               chown -R www-data:www-data /var/www/html &&
               apache2-foreground"
    restart: always

volumes:
  mariadb_data:
  moodle_code: